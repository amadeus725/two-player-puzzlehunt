services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: puzzlehunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puzzlehunt_local}
      POSTGRES_DB: puzzlehunt
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - puzzlehunt_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puzzlehunt -d puzzlehunt"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  puzzlehunt_db:
