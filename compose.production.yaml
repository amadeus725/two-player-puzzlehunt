services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: puzzlehunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password}
      POSTGRES_DB: puzzlehunt
    volumes:
      - game-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U puzzlehunt -d puzzlehunt"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    image: puzzlehunt:local
    build: .
    restart: unless-stopped
    environment: &app-environment
      DATABASE_URL: postgresql://puzzlehunt:${POSTGRES_PASSWORD}@db:5432/puzzlehunt
      APP_SECRET: ${APP_SECRET:?Set a private application secret}
      PUBLIC_ORIGIN: https://${SITE_HOST:?Set the public hostname}
      COOKIE_SECURE: "true"
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
  web:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - web-data:/data
      - web-config:/config
    depends_on:
      app: { condition: service_healthy }
  backup:
    image: puzzlehunt:local
    restart: unless-stopped
    environment:
      <<: *app-environment
      BACKUP_DIR: /backups
    command: [node, --import, tsx, scripts/backup.ts, --watch]
    volumes:
      - ${BACKUP_PATH:-./.local-backups}:/backups
    depends_on:
      app: { condition: service_healthy }
volumes:
  game-db:
  web-data:
  web-config:
